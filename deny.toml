[graph]
# cargo-deny configuration (defaults for now)

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
version = 2
ignore = [
    # Transitive dependency of arkworks 0.4 (ark-ff/ark-ec); no safe upgrade available.
    "RUSTSEC-2024-0388",
    # Transitive dependency of zerocopy-derive; no safe upgrade available.
    "RUSTSEC-2024-0436",
]
