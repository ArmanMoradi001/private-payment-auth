[package]
name = "payment-infra-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Keep the fuzz crate out of the parent workspace so `cargo fuzz` owns it.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# Workspace crates under test (pinned by path so `cargo fuzz` resolves them).
circuit = { path = "../crates/circuit" }
crypto-core = { path = "../crates/crypto-core" }
mpc = { path = "../crates/mpc" }
mpcith = { path = "../crates/mpcith" }
proof = { path = "../crates/proof" }
payment = { path = "../crates/payment" }
policy = { path = "../crates/policy" }
secret-sharing = { path = "../crates/secret-sharing" }
sdk = { path = "../crates/sdk" }
verifier = { path = "../crates/verifier" }

ark-ed25519 = "0.4"
ark-ff = "0.4"

[[bin]]
name = "decode_share"
path = "fuzz_targets/decode_share.rs"
test = false
doc = false

[[bin]]
name = "decode_circuit"
path = "fuzz_targets/decode_circuit.rs"
test = false
doc = false

[[bin]]
name = "decode_mpcith_proof"
path = "fuzz_targets/decode_mpcith_proof.rs"
test = false
doc = false

[[bin]]
name = "decode_proof"
path = "fuzz_targets/decode_proof.rs"
test = false
doc = false

[[bin]]
name = "decode_payment"
path = "fuzz_targets/decode_payment.rs"
test = false
doc = false

[[bin]]
name = "policy_range_check"
path = "fuzz_targets/policy_range_check.rs"
test = false
doc = false

[[bin]]
name = "fuzz_policy_decode"
path = "fuzz_targets/fuzz_policy_decode.rs"
test = false
doc = false

[[bin]]
name = "fuzz_policy_validate"
path = "fuzz_targets/fuzz_policy_validate.rs"
test = false
doc = false

[[bin]]
name = "fuzz_policy_normalize"
path = "fuzz_targets/fuzz_policy_normalize.rs"
test = false
doc = false

[[bin]]
name = "fuzz_policy_compile"
path = "fuzz_targets/fuzz_policy_compile.rs"
test = false
doc = false

[[bin]]
name = "fuzz_authorization_decode"
path = "fuzz_targets/fuzz_authorization_decode.rs"
test = false
doc = false

[[bin]]
