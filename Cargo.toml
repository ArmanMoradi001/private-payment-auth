[package]
name = "payment-infra"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Cryptographic payment authorization project - workspace root"
publish = false

[workspace]
resolver = "2"
members = ["crates/*"]

[dev-dependencies]
ark-ed25519 = "0.4"
ark-ff = "0.4"
digest = "0.10"
sha3 = "0.10"
circuit = { path = "crates/circuit", version = "0.1.0" }
crypto-core = { path = "crates/crypto-core", version = "0.1.0" }
criterion = "0.5"
mpc = { path = "crates/mpc", version = "0.1.0" }
mpcith = { path = "crates/mpcith", version = "0.1.0" }
payment = { path = "crates/payment", version = "0.1.0" }
policy = { path = "crates/policy", version = "0.1.0" }
proof = { path = "crates/proof", version = "0.1.0" }
sdk = { path = "crates/sdk", version = "0.1.0" }
secret-sharing = { path = "crates/secret-sharing", version = "0.1.0" }
verifier = { path = "crates/verifier", version = "0.1.0" }
proptest = "1.4"
rand_core = "0.6"
rand_chacha = "0.3"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.5"

[[test]]
name = "smoke"
path = "tests/integration/smoke.rs"

[[bench]]
name = "dummy_bench"
path = "benches/dummy_bench.rs"
harness = false

[[bench]]
name = "sdk_bench"
path = "benches/sdk_bench.rs"
harness = false
