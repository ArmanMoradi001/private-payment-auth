[package]
name = "mpcith"
version = "0.1.0"
edition = "2021"

[dependencies]
ark-ed25519 = "0.4"
ark-ff = "0.4"
circuit = { path = "../circuit" }
crypto-core = { path = "../crypto-core" }
mpc = { path = "../mpc" }
rand_core = "0.6"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
rand_chacha = "0.3"

[[bench]]
name = "mpcith_bench"
harness = false
