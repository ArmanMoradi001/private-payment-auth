[package]
name = "crypto-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Cryptographic payment authorization project - core cryptographic primitives"

[dependencies]
digest = "0.10"
sha2 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
subtle = { version = "2.5", default-features = false }
rand_core = { version = "0.6", features = ["std", "getrandom"] }

[dev-dependencies]
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "crypto_bench"
harness = false
