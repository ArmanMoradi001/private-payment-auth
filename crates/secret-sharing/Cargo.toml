[package]
name = "secret-sharing"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Cryptographic payment authorization project - Shamir secret sharing"

[dependencies]
ark-ed25519 = "0.4"
ark-ff = "0.4"
ark-std = "0.4"
crypto-core = { path = "../crypto-core", version = "0.1.0" }
rand_core = "0.6"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
rand_chacha = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bench]]
name = "shamir_bench"
harness = false

