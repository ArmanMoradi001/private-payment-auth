[package]
name = "payment"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Cryptographic payment authorization project - payment authorization logic"

[dependencies]
ark-ed25519 = "0.4"
ark-ff = "0.4"
circuit = { path = "../circuit", version = "0.1.0" }
crypto-core = { path = "../crypto-core", version = "0.1.0" }
mpc = { path = "../mpc", version = "0.1.0" }
policy = { path = "../policy", version = "0.1.0" }
proof = { path = "../proof", version = "0.1.0" }
rand_core = "0.6"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
rand_chacha = "0.3"

[[bench]]
name = "authorization_bench"
harness = false

[[bench]]
name = "payment_bench"
harness = false
